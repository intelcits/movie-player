<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Selector Estilo Sansui</title>
<style>
  @import url('https://googleapis.com');

  body {
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Rajdhani', sans-serif;
  }

  /* Chasis frontal de aluminio negro cepillado estilo Sansui */
  .sansui-panel {
    background: linear-gradient(180deg, #2b2b2b 0%, #1c1c1c 15%, #161616 85%, #0d0d0d 100%);
    border-top: 2px solid #555;
    border-bottom: 3px solid #000;
    border-left: 2px solid #333;
    border-right: 2px solid #333;
    border-radius: 4px;
    padding: 30px 45px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    display: flex;
    gap: 50px;
    position: relative;
  }

  /* Línea dorada/ámbar clásica de la serie AU/TU */
  .sansui-panel::before {
    content: "";
    position: absolute;
    top: 10px;
    left: 15px;
    right: 15px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #b8860b, transparent);
    opacity: 0.6;
  }

  .switch-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 110px;
  }

  /* Etiqueta principal que se ilumina al encender */
  .channel-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding: 4px 8px;
    border-radius: 2px;
    background: #101010;
    border: 1px solid #2a2a2a;
    transition: all 0.25s ease;
    text-shadow: none;
    user-select: none;
  }

  /* Indicadores ON / OFF grabados en el metal */
  .pos-text {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #888;
    margin: 4px 0;
    user-select: none;
  }

  /* Contenedor del interruptor físico */
  .toggle-wrapper {
    position: relative;
    width: 44px;
    height: 76px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Ocultar checkbox nativo */
  .toggle-wrapper input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }

  /* Tuerca hexagonal cromada base */
  .hex-nut {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #e0e0e0 0%, #8c8c8c 50%, #4a4a4a 100%);
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.8);
    position: relative;
  }

  /* Hueco oscuro interno de la base */
  .socket {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #000 40%, #333 100%);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.9);
  }

  /* Palanca metálica cilíndrica (Posición OFF por defecto: hacia abajo) */
  .lever {
    position: absolute;
    width: 10px;
    height: 34px;
    background: linear-gradient(90deg, #999 0%, #fff 40%, #777 80%, #444 100%);
    border-radius: 5px;
    top: 38px; /* Apunta hacia abajo en OFF */
    transform-origin: top center;
    box-shadow: 0 6px 8px rgba(0, 0, 0, 0.85), inset 0 -2px 3px rgba(0,0,0,0.5);
    transition: all 0.18s cubic-bezier(0.25, 1, 0.5, 1);
    pointer-events: none;
  }

  /* Punta redondeada de la palanca */
  .lever::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: -1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #888888 60%, #333333 100%);
  }

  /* ESTADO ON (Checkbox marcado) */
  /* Palanca sube hacia ON */
  .toggle-wrapper input:checked ~ .lever {
    top: 4px;
    box-shadow: 0 -4px 8px rgba(0, 0, 0, 0.7), inset 0 2px 3px rgba(255,255,255,0.6);
  }

  .toggle-wrapper input:checked ~ .lever::after {
    bottom: auto;
    top: -2px;
  }

  /* Encendido de la palabra seleccionada (Efecto display fluorescente / LED ámbar-verde Sansui) */
  .switch-unit:has(input:checked) .channel-label {
    color: #ffae00;
    border-color: #ff9900;
    background: #1f1605;
    box-shadow: 0 0 12px rgba(255, 166, 0, 0.5), inset 0 0 6px rgba(255, 166, 0, 0.3);
    text-shadow: 0 0 8px rgba(255, 174, 0, 0.9);
  }

  /* Iluminación del texto "ON" */
  .switch-unit:has(input:checked) .pos-on {
    color: #ffae00;
    text-shadow: 0 0 5px rgba(255, 174, 0, 0.7);
  }

  /* Iluminación tenue del texto "OFF" cuando está apagado */
  .switch-unit:not(:has(input:checked)) .pos-off {
    color: #ccc;
  }
</style>
</head>
<body>

<div class="sansui-panel">
  
  <!-- INTERRUPTOR 1: MOVIES -->
  <div class="switch-unit">
    <div class="channel-label">MOVIES</div>
    <span class="pos-text pos-on">ON</span>
    <label class="toggle-wrapper">
      <input type="checkbox" name="movies">
      <div class="hex-nut"><div class="socket"></div></div>
      <div class="lever"></div>
    </label>
    <span class="pos-text pos-off">OFF</span>
  </div>

  <!-- INTERRUPTOR 2: SERIES -->
  <div class="switch-unit">
    <div class="channel-label">SERIES</div>
    <span class="pos-text pos-on">ON</span>
    <label class="toggle-wrapper">
      <input type="checkbox" name="series" checked> <!-- Inicia encendido como ejemplo -->
      <div class="hex-nut"><div class="socket"></div></div>
      <div class="lever"></div>
    </label>
    <span class="pos-text pos-off">OFF</span>
  </div>

  <!-- INTERRUPTOR 3: STREAMING -->
  <div class="switch-unit">
    <div class="channel-label">STREAMING</div>
    <span class="pos-text pos-on">ON</span>
    <label class="toggle-wrapper">
      <input type="checkbox" name="streaming">
      <div class="hex-nut"><div class="socket"></div></div>
      <div class="lever"></div>
    </label>
    <span class="pos-text pos-off">OFF</span>
  </div>

</div>

</body>
</html>
